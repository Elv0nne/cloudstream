name: Archive build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "Archive-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Original workflow fetched the keystore + password from the
    # org-only recloudstream/secrets repo via a GitHub App token.
    # Forks don't have access to that repo, so this restores a
    # personal keystore instead, decoded from the KEYSTORE_BASE64
    # repo secret. Set up KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS
    # under Settings -> Secrets and variables -> Actions.
    - name: Restore keystore
      id: fetch_keystore
      run: |
        TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
        mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
        echo "::add-mask::${{ secrets.KEYSTORE_PASSWORD }}"
        echo "key_pwd=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    # Original workflow pushed the APK into the org-only
    # recloudstream/cloudstream-archive repo. Forks don't have that
    # repo (and shouldn't try to create one just to mimic this), so
    # this uploads the APK as a downloadable Actions artifact instead.
    - name: Upload archived build
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-archive-${{ github.sha }}
        path: "app/build/outputs/apk/prerelease/release/*.apk"
        retention-days: 90
