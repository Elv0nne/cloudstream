name: Dokka

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

# The original workflow pushed the generated docs to a separate
# org-only repo (recloudstream/dokka) used as its GitHub Pages source,
# via a GitHub App token forks don't have. This version instead
# publishes straight to this repo's own GitHub Pages using GitHub's
# official Pages deployment actions, which only need the permissions
# below (no extra secrets).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "dokka-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka
        run: |
          chmod +x gradlew
          ./gradlew docs:dokkaGeneratePublicationHtml

      - name: Prepare Pages output
        run: touch docs/build/dokka/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
